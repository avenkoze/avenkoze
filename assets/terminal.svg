<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">avenkoze PowerShell profile</title>
  <desc id="desc">A restrained Windows Terminal window showing a PowerShell profile command and GitHub information beside purple ASCII art.</desc>

  <defs>
    <style>
      .mono { font-family: "Cascadia Mono", "Cascadia Code", Consolas, monospace; }
      .copy { fill: #ddd8df; font-size: 13px; }
      .dim { fill: #948c99; font-size: 12px; }
      .purple { fill: #d59be8; }
      .cyan { fill: #62d8df; }
    </style>
  </defs>

  <!-- Windows Terminal chrome. -->
  <rect x="25" y="25" width="850" height="430" rx="8" fill="#19171d" stroke="#333039"/>
  <path d="M33 25h834a8 8 0 0 1 8 8v39H25V33a8 8 0 0 1 8-8Z" fill="#202026"/>
  <rect x="37" y="32" width="205" height="34" rx="5" fill="#0e0d11"/>
  <rect x="48" y="41" width="16" height="16" rx="2" fill="#3b7bd6"/>
  <text x="52" y="53" class="mono" fill="#fff" font-size="9" font-weight="700">&gt;_</text>
  <text x="73" y="54" class="mono" fill="#e7e5e9" font-size="12">PowerShell 7.6.3</text>
  <text x="221" y="54" class="mono" fill="#8b8790" font-size="13">×</text>
  <text x="258" y="53" class="mono" fill="#cbc8ce" font-size="17">+</text>
  <text x="288" y="52" class="mono" fill="#8b8790" font-size="13">⌄</text>
  <path d="M776 44h10" stroke="#aaa6ae"/>
  <rect x="812" y="41" width="10" height="9" fill="none" stroke="#aaa6ae"/>
  <text x="851" y="52" text-anchor="middle" font-family="Arial, sans-serif" fill="#aaa6ae" font-size="16">×</text>

  <!-- Terminal body. -->
  <rect x="25" y="72" width="850" height="383" fill="#1b1620"/>

  <text x="45" y="99" class="mono copy">PowerShell 7.6.3</text>
  <text x="45" y="119" class="mono dim">Copyright (c) Microsoft Corporation.</text>
  <text x="45" y="149" class="mono copy"><tspan class="cyan">PS C:\Users\avenkoze&gt;</tspan><tspan dx="10">fastfetch</tspan></text>

  <!-- Plain ASCII art: no text glow, only the purple terminal foreground color. -->
  <g class="mono purple" font-size="13.5">
    <text x="52" y="193" xml:space="preserve">          ++          ++</text>
    <text x="52" y="209" xml:space="preserve">       ++++++      ++++++</text>
    <text x="52" y="225" xml:space="preserve">    ++++   +++    +++   ++++</text>
    <text x="52" y="241" xml:space="preserve">  +++       ++++++++       +++</text>
    <text x="52" y="257" xml:space="preserve">++          ++++++          ++</text>
    <text x="52" y="273" xml:space="preserve"> ++++     ++++++++++++     ++++</text>
    <text x="52" y="289" xml:space="preserve">   ++++++++++++++++++++++++++</text>
    <text x="52" y="305" xml:space="preserve">     +++++++  ++  +++++++</text>
    <text x="52" y="321" xml:space="preserve">       ++++   ++   ++++</text>
    <text x="52" y="337" xml:space="preserve">     +++     ++++     +++</text>
    <text x="52" y="353" xml:space="preserve">   +++      ++  ++      +++</text>
    <text x="52" y="369" xml:space="preserve"> ++        ++    ++        ++</text>
  </g>

  <!-- Fastfetch-style profile output. -->
  <g class="mono" font-size="13">
    <text x="465" y="187" class="purple" font-weight="700">avenkoze</text>
    <text x="535" y="187" fill="#8c8490">@</text>
    <text x="549" y="187" class="cyan" font-weight="700">github</text>
    <path d="M465 197h315" stroke="#65536c"/>

    <text x="465" y="222" class="purple" font-weight="700">OS</text>
    <text x="555" y="222" class="copy">GitHub Profile</text>
    <text x="465" y="246" class="purple" font-weight="700">Host</text>
    <text x="555" y="246" class="copy">github.com</text>
    <text x="465" y="270" class="purple" font-weight="700">Shell</text>
    <text x="555" y="270" class="copy">PowerShell 7.6.3</text>
    <text x="465" y="294" class="purple" font-weight="700">Repo</text>
    <text x="555" y="294" class="copy">avenkoze/avenkoze</text>
    <text x="465" y="318" class="purple" font-weight="700">Branch</text>
    <text x="555" y="318" class="copy">main</text>
    <text x="465" y="342" class="purple" font-weight="700">Public</text>
    <text x="555" y="342" class="copy">6 repositories</text>

    <rect x="465" y="366" width="18" height="9" fill="#17151a"/>
    <rect x="487" y="366" width="18" height="9" fill="#5f5964"/>
    <rect x="509" y="366" width="18" height="9" fill="#d59be8"/>
    <rect x="531" y="366" width="18" height="9" fill="#62d8df"/>
    <rect x="553" y="366" width="18" height="9" fill="#4879bf"/>
    <rect x="575" y="366" width="18" height="9" fill="#76b475"/>
    <rect x="597" y="366" width="18" height="9" fill="#d4a455"/>
    <rect x="619" y="366" width="18" height="9" fill="#c86d7d"/>
  </g>

  <text x="45" y="424" class="mono copy"><tspan class="cyan">PS C:\Users\avenkoze&gt;</tspan><tspan> </tspan></text>
  <rect x="216" y="412" width="8" height="15" fill="#d9d5dc">
    <animate attributeName="opacity" values="1;1;0;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
